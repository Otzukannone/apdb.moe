<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apdb.moe — mockup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bgDots"></div>

<section id="hero">
  <div id="bandGroup">
    <div class="band-bg"></div>
    <h1>welcome to apdb.moe</h1>
    <div class="ticker"><span id="tickerText">apdb stands for nothing in particular &nbsp;&nbsp;•&nbsp;&nbsp; apdb stands for nothing in particular</span></div>
    <div class="pfp" aria-label="profile picture">
      <img src="assets/some2.png" alt="profile picture">
    </div>
  </div>

  <div id="cardSlot">
    <div id="menuFrame">
      <div id="loadingCard"></div>

      <div id="menuBox">
        <div class="row" data-idx="0" data-target="what/"><span class="num">1.</span> What</div>
        <div class="row" data-idx="1" data-target="booru/"><span class="num">2.</span> booru</div>
        <div class="row" data-idx="2" data-target="atelierphischers/"><span class="num">3.</span> atelierphischers</div>
        <div class="row" data-idx="3" data-target="tba/"><span class="num">4.</span> tba</div>
        <div class="status" id="statusLine">&nbsp;</div>
      </div>
    </div>
    <div id="menuHint">↑ / ↓ to move · enter to select</div>
  </div>
</section>

<section id="more">
  <div class="stub">— more stuff goes here later —</div>
</section>

<div id="devbar">
  <span id="devState">checking…</span>
  <button id="resetBtn">reset intro</button>
  <button id="editToggle">edit positions: off</button>
  <span id="phaseControls" hidden>
    band:
    <button id="phaseIdleBtn" class="active">idle</button>
    <button id="phaseDroppedBtn">dropped</button>
  </span>
</div>
<pre id="editReadout" hidden></pre>

<script>
(function(){
  const STORAGE_KEY   = 'apdb_last_intro_seen';
  const COOLDOWN_MS   = 2 * 60 * 1000;
  const DROP_DELAY_MS = 2400;
  const MORPH_DELAY_MS = 300;

  const hero        = document.getElementById('hero');
  const bandGroup    = document.getElementById('bandGroup');
  const cardSlot      = document.getElementById('cardSlot');
  const loadingCard  = document.getElementById('loadingCard');
  const menuBox      = document.getElementById('menuBox');
  const menuHint     = document.getElementById('menuHint');
  const devState     = document.getElementById('devState');
  const resetBtn     = document.getElementById('resetBtn');
  const editToggle   = document.getElementById('editToggle');
  const phaseControls = document.getElementById('phaseControls');
  const phaseIdleBtn = document.getElementById('phaseIdleBtn');
  const phaseDroppedBtn = document.getElementById('phaseDroppedBtn');
  const editReadout  = document.getElementById('editReadout');

  let pendingTimers = [];
  function clearPending(){ pendingTimers.forEach(clearTimeout); pendingTimers = []; }

  async function getLastSeen(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      return res ? parseInt(res.value, 10) : null;
    }catch(e){ return null; }
  }
  async function markSeen(){
    try{ await window.storage.set(STORAGE_KEY, String(Date.now()), false); }
    catch(e){ }
  }

  function toIdleState(){
    bandGroup.classList.remove('dropped');
    cardSlot.classList.remove('show');
    loadingCard.classList.remove('hide');
    menuBox.classList.remove('show');
    menuHint.classList.remove('show');
  }
  function toFinalStateInstant(){
    const els = [bandGroup, cardSlot, loadingCard, menuBox, menuHint];
    els.forEach(el => el.style.transition = 'none');
    bandGroup.classList.add('dropped');
    cardSlot.classList.add('show');
    loadingCard.classList.add('hide');
    menuBox.classList.add('show');
    menuHint.classList.add('show');
    initMenu();
    void bandGroup.offsetHeight;
    requestAnimationFrame(() => { els.forEach(el => el.style.transition = ''); });
  }

  async function boot(force){
    if (editMode) return;
    clearPending();
    window.scrollTo(0, 0);
    toIdleState();

    devState.textContent = 'intro skipped → menu ready';
    toFinalStateInstant();
    return;
  }

  let menuBound = false;
  function initMenu(){
    const rows = Array.from(document.querySelectorAll('#menuBox .row'));
    const statusLine = document.getElementById('statusLine');
    let idx = 0;

    function render(){ rows.forEach((r,i) => r.classList.toggle('selected', i === idx)); }
    function select(){
      const row = rows[idx];
      const label = row.textContent.trim().replace(/^\d+\.\s*/, '');
      const target = row.dataset.target;
      statusLine.textContent = '→ opening ' + label + ' …';
      if (target) {
        window.location.href = target;
      }
    }
    render();

    rows.forEach((r,i) => {
      r.addEventListener('mouseenter', () => { if (editMode) return; idx = i; render(); });
      r.addEventListener('click', () => { if (editMode) return; idx = i; render(); select(); });
    });

    if (!menuBound){
      menuBound = true;
      window.addEventListener('keydown', (e) => {
        if (editMode || !menuBox.classList.contains('show')) return;
        if (e.key === 'ArrowDown'){ idx = (idx + 1) % rows.length; render(); e.preventDefault(); }
        else if (e.key === 'ArrowUp'){ idx = (idx - 1 + rows.length) % rows.length; render(); e.preventDefault(); }
        else if (e.key === 'Enter' || e.key === ' '){ select(); e.preventDefault(); }
      });
    }
  }

  resetBtn.addEventListener('click', async () => {
    try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
    boot(true);
  });

  let editMode = false;

  function updateReadout(){
    const cs = getComputedStyle(document.documentElement);
    editReadout.textContent =
`:root{
  --band-top: ${cs.getPropertyValue('--band-top').trim()};
  --band-top-dropped: ${cs.getPropertyValue('--band-top-dropped').trim()};
  --menu-top: ${cs.getPropertyValue('--menu-top').trim()};
}`;
  }

  function setBandPhaseButtons(dropped){
    phaseIdleBtn.classList.toggle('active', !dropped);
    phaseDroppedBtn.classList.toggle('active', dropped);
    bandGroup.classList.toggle('dropped', dropped);
  }

  function enterEditMode(){
    editMode = true;
    clearPending();
    editToggle.textContent = 'edit positions: on';
    editToggle.classList.add('active');
    phaseControls.hidden = false;
    editReadout.hidden = false;
    document.body.classList.add('edit-mode');

    setBandPhaseButtons(false);
    cardSlot.classList.add('show');
    loadingCard.classList.add('hide');
    menuBox.classList.add('show');
    menuHint.classList.add('show');
    updateReadout();
  }
  function exitEditMode(){
    editMode = false;
    editToggle.textContent = 'edit positions: off';
    editToggle.classList.remove('active');
    phaseControls.hidden = true;
    editReadout.hidden = true;
    document.body.classList.remove('edit-mode');
    boot(true);
  }
  editToggle.addEventListener('click', () => { editMode ? exitEditMode() : enterEditMode(); });
  phaseIdleBtn.addEventListener('click', () => setBandPhaseButtons(false));
  phaseDroppedBtn.addEventListener('click', () => setBandPhaseButtons(true));

  function makeDraggableVertical(el, varNameFn){
    let dragging = false, pointerId = null, grabOffsetY = 0;
    el.addEventListener('pointerdown', (e) => {
      if (!editMode) return;
      dragging = true;
      pointerId = e.pointerId;
      el.setPointerCapture(pointerId);
      el.classList.add('dragging');
      const elRect = el.getBoundingClientRect();
      grabOffsetY = e.clientY - elRect.top;
      e.preventDefault();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const heroRect = hero.getBoundingClientRect();
      const newTopPx = e.clientY - grabOffsetY - heroRect.top;
      const pct = (newTopPx / heroRect.height) * 100;
      document.documentElement.style.setProperty(varNameFn(), pct.toFixed(1) + '%');
      updateReadout();
    });
    function endDrag(){
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  makeDraggableVertical(bandGroup, () => bandGroup.classList.contains('dropped') ? '--band-top-dropped' : '--band-top');
  makeDraggableVertical(cardSlot, () => '--menu-top');

  boot(false);
})();
</script>

</body>
</html>
