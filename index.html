<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apdb.moe — mockup</title>
<link rel="icon" type="image/png" href="assets/yuyuk.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bgDots"></div>

<section id="hero">
  <div id="bandGroup">
    <div class="band-bg"></div>
    <h1>welcome to apdb.moe</h1>
    <div class="ticker"><span id="tickerText">apdb stands for nothing in particular &nbsp;&nbsp;•&nbsp;&nbsp; apdb stands for nothing in particular</span></div>
    <div class="pfp" aria-label="profile picture">
      <img src="assets/some2.png" alt="profile picture">
    </div>
  </div>

  <div id="cardSlot">
    <div id="menuFrame">
      <div id="menuBox">
        <div class="row" data-idx="0" data-target="what/"><span class="num">1.</span> What</div>
        <div class="row" data-idx="1" data-target="booru/"><span class="num">2.</span> booru</div>
        <div class="row" data-idx="2" data-target="atelierphischers/"><span class="num">3.</span> atelierphischers</div>
        <div class="row" data-idx="3" data-target="tba/"><span class="num">4.</span> tba</div>
        <div class="status" id="statusLine">&nbsp;</div>
      </div>
    </div>
    <div id="menuHint">↑ / ↓ to move · enter to select</div>
  </div>
</section>

<section id="more">
  <div class="stub">— more stuff goes here later —</div>
</section>

<script>
(function(){
  const hero = document.getElementById('hero');
  const bandGroup = document.getElementById('bandGroup');
  const cardSlot = document.getElementById('cardSlot');
  const menuBox = document.getElementById('menuBox');
  const menuHint = document.getElementById('menuHint');

  function toFinalState(){
    bandGroup.classList.add('dropped');
    cardSlot.classList.add('show');
    menuBox.classList.add('show');
    menuHint.classList.add('show');
    initMenu();
  }

  let menuBound = false;
  function initMenu(){
    const rows = Array.from(document.querySelectorAll('#menuBox .row'));
    const statusLine = document.getElementById('statusLine');
    let idx = 0;

    function render(){
      rows.forEach((row, i) => row.classList.toggle('selected', i === idx));
    }

    function select(){
      const row = rows[idx];
      const label = row.textContent.trim().replace(/^\d+\.\s*/, '');
      const target = row.dataset.target;
      statusLine.textContent = '→ opening ' + label + ' …';
      if (target) {
        window.location.href = target;
      }
    }

    render();

    rows.forEach((row, i) => {
      row.addEventListener('mouseenter', () => { idx = i; render(); });
      row.addEventListener('click', () => { idx = i; render(); select(); });
    });

    if (!menuBound) {
      menuBound = true;
      window.addEventListener('keydown', (event) => {
        if (!menuBox.classList.contains('show')) return;
        if (event.key === 'ArrowDown') {
          idx = (idx + 1) % rows.length;
          render();
          event.preventDefault();
        } else if (event.key === 'ArrowUp') {
          idx = (idx - 1 + rows.length) % rows.length;
          render();
          event.preventDefault();
        } else if (event.key === 'Enter' || event.key === ' ') {
          select();
          event.preventDefault();
        }
      });
    }
  }

  toFinalState();
})();
</script>

</body>
</html>
